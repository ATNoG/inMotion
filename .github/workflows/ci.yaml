name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Importing mamba_ssm can hang for minutes while it builds CUDA kernels.
  MAMBA_SSM_AVAILABLE: "0"

jobs:
  quality:
    name: Lint, format, reference docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync root project
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check src tests
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Reference docs must match the code
        run: uv run python scripts/docs/generate_reference.py --check

  test:
    name: Tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync root project
        run: uv sync --all-packages
      # Model checkpoints are large binaries and are not in git, so the
      # model-level tests skip with an explicit reason instead of failing.
      # Everything else must pass.
      - name: Run root suite
        run: uv run pytest tests/ -v
      - name: Run demo suite
        working-directory: demo
        run: uv run --project . pytest -v

  security:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync root project
        run: uv sync --all-packages
      - name: Secret guard
        run: uv run pytest tests/test_no_secrets.py -v
