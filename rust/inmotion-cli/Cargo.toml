[package]
name = "inmotion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Run an exported inMotion model on x86 / a router"

[[bin]]
name = "inmotion-infer"
path = "src/main.rs"

[dependencies]
inmotion-core = { path = "../inmotion-core" }
serde_json = "1"
# Only for the four syscalls the runtime cannot make through std: clock_gettime,
# sched_setaffinity/sched_getaffinity, posix_fadvise and sysconf.
libc = "0.2"

[lints]
workspace = true
