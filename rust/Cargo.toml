[workspace]
resolver = "2"
members = ["inmotion-core", "inmotion-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["André Ribeiro <andrepedro2004@hotmail.com>"]

# Enforced locally by `cargo clippy --all-targets -- -D warnings` and
# `cargo test`; the crate is small enough that these should stay at zero.
[workspace.lints.rust]
# `deny`, not `forbid`, so the unsafe blockmatrix backends can mark themselves.
# `forbid` cannot be lifted by an inner `allow`, and `matrixmultiply::sgemm` and
# `gemm::gemm` are unsafe APIs. Everything else still denies unsafe, and the two
# call sites carry their own justification.
# unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `pedantic` is noisy about casts that are intentional in numeric kernels.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
